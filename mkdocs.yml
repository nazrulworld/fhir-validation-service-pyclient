site_name: fvs_client
site_description: Typed Python SDK (sync + async) for the FHIR Validation Service
site_url: https://nazrulworld.github.io/fhir-validation-service-pyclient/
repo_url: https://github.com/nazrulworld/fhir-validation-service-pyclient
repo_name: fhir-validation-service-pyclient
edit_uri: edit/main/docs/
copyright: Apache-2.0 · FHIR® and HL7® are registered trademarks of HL7 International

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Guides:
      - Validation: validation.md
      - IG packages & contexts: packages-and-contexts.md
      - Health: health.md
      - Errors & retries: errors-and-retries.md
      - Async & batch: async-and-batch.md
      - Raw responses: raw-responses.md
  - API reference: reference/index.md
  - Changelog: changelog.md
